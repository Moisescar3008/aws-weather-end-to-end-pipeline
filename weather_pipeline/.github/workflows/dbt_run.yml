name: dbt run

on:
  schedule:
    - cron: '0 * * * *'  # cada hora
  workflow_dispatch:       # permite correrlo manualmente desde GitHub

jobs:
  dbt_run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-athena-community

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          weather_pipeline:
            target: dev
            outputs:
              dev:
                type: athena
                region_name: us-east-1
                s3_staging_dir: s3://weather-pipeline-merida/athena-results/
                s3_data_dir: s3://weather-pipeline-merida/silver/
                schema: weather_pipeline
                database: awsdatacatalog
                aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                threads: 1
          EOF

      - name: Run dbt
        working-directory: weather_pipeline
        run: dbt run